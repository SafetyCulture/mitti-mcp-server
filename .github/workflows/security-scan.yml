name: Security scan

# Scans every push to main and every pull request for verified, live
# credentials before they land in history. --only-verified keeps this to
# confirmed secrets so the check stays high-signal instead of something
# people learn to ignore.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TruffleHog diffs base..head itself, which needs the actual
          # history — a shallow clone only has the tip commit.
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.96.0
          extra_args: --only-verified
