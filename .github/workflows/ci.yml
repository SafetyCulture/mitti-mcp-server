name: CI

# Early feedback on every push and PR: lint, then the test suite. The suite
# runs in well under a second, so this is cheap to run on every push.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Single-sourced from .config/mise.toml so local and CI can't drift.
      - name: Resolve the Node version
        id: node
        run: |
          version=$(sed -n 's/^node = "\(.*\)"/\1/p' .config/mise.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read the node version from .config/mise.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Tighter than the job cap: a hanging test is the failure mode we've
      # actually hit, and `node --test` will sit there indefinitely rather
      # than fail. The suite runs in well under a second.
      - name: Test
        timeout-minutes: 5
        run: npm test
