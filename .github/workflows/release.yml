name: Release

# Publishes a GitHub release carrying a prebuilt, dependency-free bundle, so
# installing needs no toolchain and no `npm install` of transitive deps.
#
# Tag a commit to release it:
#   npm version minor && git push --follow-tags
#
# Three assets are attached:
#   mitti-mcp-<version>.tgz  — npm-installable, version-pinned
#   mitti-mcp.tgz            — same tarball at a stable `latest/download` URL
#   sc-mcp.tgz               — pre-rebrand alias of the same tarball, so older
#                              configs keep resolving; remove once unused
#   mitti-mcp.mjs            — the raw bundle, runnable with `node mitti-mcp.mjs`
#
# The repository is public, so these asset URLs resolve without a GitHub token
# and are what the README points end users at — `npx <url>` works unauthenticated.
# Making the repo private again would break that install path.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes, so a hung step burns six hours of runner
    # time before anything notices. A clean run takes under two minutes.
    timeout-minutes: 20
    steps:
      # A dispatch naming a tag that doesn't exist otherwise fails deep inside
      # actions/checkout as an opaque `git fetch` exit 1. Say so plainly instead.
      - name: Check the tag exists
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG does not exist. Create it first, e.g. 'npm version minor && git push --follow-tags'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Single-sourced from .config/mise.toml so local and CI can't drift.
      - name: Resolve the Node version
        id: node
        run: |
          version=$(sed -n 's/^node = "\(.*\)"/\1/p' .config/mise.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read the node version from .config/mise.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json ships a package whose version
      # doesn't match its release — catch it before anything is published.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="v$(npm pkg get version | tr -d '"')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json ($version)"
            exit 1
          fi

      # Tighter than the job cap: a hanging test is the failure mode we've
      # actually hit, and `node --test` will sit there indefinitely rather than
      # fail. The suite runs in well under a second.
      - name: Test
        timeout-minutes: 5
        run: npm test

      # The Amplitude key is injected here rather than committed. It ends up
      # readable inside the published bundle either way, which is why it must be
      # the project's write-only ingestion key and never its secret key.
      #
      # A release built without the key reports nothing, and nothing about it
      # looks wrong until someone asks why there's no usage data — months later,
      # with no way to recover what wasn't recorded. So a missing secret fails the
      # release rather than shipping a blind one.
      - name: Bundle
        env:
          PUBLIC_AMPLITUDE_API_KEY: ${{ secrets.PUBLIC_AMPLITUDE_API_KEY }}
        run: |
          if [ -z "$PUBLIC_AMPLITUDE_API_KEY" ]; then
            echo "::error::PUBLIC_AMPLITUDE_API_KEY is not set — add it under Settings → Secrets and variables → Actions. A release built without it reports no usage at all."
            exit 1
          fi
          npm run bundle:release

      # The bundle must run with no node_modules at all — that's the whole
      # point of shipping it. Verify rather than assume: a bad token exits
      # non-zero, so check for the message that proves it got that far.
      - name: Verify the bundle is self-contained
        run: |
          mkdir -p "$RUNNER_TEMP/isolated"
          cp dist/mitti-mcp.mjs "$RUNNER_TEMP/isolated/"
          cd "$RUNNER_TEMP/isolated"
          output=$(MITTI_API_TOKEN=invalid-token node mitti-mcp.mjs </dev/null 2>&1 || true)
          echo "$output"
          case "$output" in
            *"Cannot find module"*|*"ERR_MODULE_NOT_FOUND"*)
              echo "::error::bundle is not self-contained"; exit 1 ;;
          esac
          # Must match the stderr prefix in src/index.ts.
          case "$output" in
            mitti-mcp:*) ;;
            *) echo "::error::bundle did not start"; exit 1 ;;
          esac

      - name: Pack
        run: |
          # --ignore-scripts is load-bearing. `npm pack` runs the `prepare`
          # script, which is `npm run bundle` — the build *without* the analytics
          # key. It would silently overwrite the bundle the step above just built,
          # and that is exactly what shipped a keyless v0.3.0 while every check
          # passed. The bundle is already built; packing must not rebuild it.
          tarball=$(npm pack --ignore-scripts --silent | tail -1)
          echo "tarball=$tarball" >> "$GITHUB_ENV"
          # An unversioned copy too, so `releases/latest/download/mitti-mcp.tgz`
          # is a stable URL that docs and configs never have to be updated for.
          cp "$tarball" mitti-mcp.tgz
          # The pre-rebrand name, published alongside it so any config still
          # pointing at `latest/download/sc-mcp.tgz` keeps resolving. Drop this
          # once early-access users have moved to the Mitti URL.
          cp "$tarball" sc-mcp.tgz

      # Check the artifacts that actually ship, not an intermediate build. The
      # first version of this check ran before Pack, passed, and then watched
      # `npm pack` replace the file it had just approved — so it now reads the
      # packed tarball and the standalone asset, which are what customers get.
      - name: Verify the published bundles report usage
        env:
          PUBLIC_AMPLITUDE_API_KEY: ${{ secrets.PUBLIC_AMPLITUDE_API_KEY }}
        run: |
          if ! tar -xzOf "$tarball" package/dist/mitti-mcp.mjs | grep -qF "$PUBLIC_AMPLITUDE_API_KEY"; then
            echo "::error::the tarball's bundle has no analytics key — it would report nothing"
            exit 1
          fi
          if ! grep -qF "$PUBLIC_AMPLITUDE_API_KEY" dist/mitti-mcp.mjs; then
            echo "::error::the standalone mitti-mcp.mjs asset has no analytics key"
            exit 1
          fi
          echo "both published bundles carry the analytics key"

      # Confirm the packed tarball installs with no transitive dependencies.
      - name: Verify the tarball installs clean
        run: |
          mkdir -p "$RUNNER_TEMP/installcheck"
          cd "$RUNNER_TEMP/installcheck"
          npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE/$tarball"
          count=$(ls node_modules | grep -v '^\.' | wc -l | tr -d ' ')
          echo "packages installed: $count"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected only mitti-mcp, got $count packages"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "$tarball" \
            mitti-mcp.tgz \
            sc-mcp.tgz \
            dist/mitti-mcp.mjs
